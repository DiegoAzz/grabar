services:
  - type: web
    name: loom-clone
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    disk:
      name: loom-storage
      mountPath: /app/uploads
      sizeGB: 1
